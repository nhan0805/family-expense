name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build

  db-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Exclude user-dependent data migrations from structural tests
        run: |
          mkdir -p /tmp/supabase-user-migrations
          mv supabase/migrations/202608250004_excel_data.sql /tmp/supabase-user-migrations/
          mv supabase/migrations/202608260019_excel_data_date_shift.sql /tmp/supabase-user-migrations/
      - name: Start local Supabase database
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,postgrest,postgres-meta,studio,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Run database and RLS tests
        run: supabase test db --local
      - name: Stop local Supabase
        if: ${{ always() }}
        run: supabase stop
