name: Cloudflare Pages Preview Build
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Cloudflare Pages is connected to GitHub and creates the preview
      # deployment automatically. Keep this workflow secret-free and use it
      # only to verify that the production build succeeds on every PR.
      - name: Verify production build
        run: test -d dist && test -f dist/index.html
