<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="icon-title icon-description">
  <title id="icon-title">Family Finance</title>
  <desc id="icon-description">Biểu tượng ví tài chính với điểm nhấn tăng trưởng</desc>
  <defs>
    <linearGradient id="icon-background" x1="84" y1="40" x2="428" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123e56"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <linearGradient id="icon-wallet" x1="112" y1="132" x2="402" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15869a"/>
      <stop offset="1" stop-color="#0f5f78"/>
    </linearGradient>
    <pattern id="icon-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#62e6d0" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <filter id="icon-shadow" x="-.2" y="-.2" width="1.4" height="1.5" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020a13" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#icon-background)"/>
  <rect width="512" height="512" rx="120" fill="url(#icon-grid)" opacity=".72"/>
  <circle cx="402" cy="108" r="94" fill="#62e6d0" opacity=".08"/>
  <circle cx="104" cy="424" r="104" fill="#f5c36a" opacity=".08"/>
  <g filter="url(#icon-shadow)">
    <rect x="92" y="128" width="328" height="256" rx="62" fill="url(#icon-wallet)" stroke="#a0f7e8" stroke-width="14"/>
    <path d="M99 222H413" fill="none" stroke="#a0f7e8" stroke-opacity=".78" stroke-width="12"/>
    <path d="M300 230H366C394 230 416 252 416 280s-22 50-50 50H300c-28 0-50-22-50-50s22-50 50-50Z" fill="#06221e" fill-opacity=".82" stroke="#62e6d0" stroke-width="9"/>
    <circle cx="303" cy="280" r="12" fill="#f5c36a"/>
    <path d="M153 296h58M153 332h28" fill="none" stroke="#e9f7fa" stroke-linecap="round" stroke-width="14"/>
    <path d="M151 193c22-27 47-33 69-13 20 18 40 19 65-12" fill="none" stroke="#f5c36a" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
    <path d="m275 168 13 1-3 13" fill="none" stroke="#f5c36a" stroke-linecap="round" stroke-linejoin="round" stroke-width="10"/>
